<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyflowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#skyflowBg)"/>

  <!-- Top Kanban Header -->
  <rect x="40" y="30" width="720" height="40" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="60" y="55" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">SkyFlow Agile Board</text>

  <!-- 3 Kanban Columns -->
  <!-- Column 1: TODO -->
  <rect x="40" y="90" width="220" height="320" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <text x="60" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold">Backlog (3)</text>
  
  <rect x="55" y="140" width="190" height="80" rx="8" fill="rgba(255,255,255,0.08)"/>
  <text x="70" y="165" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Auth System Migration</text>
  <rect x="70" y="180" width="60" height="18" rx="4" fill="#ef4444"/>
  <text x="80" y="193" fill="#ffffff" font-family="sans-serif" font-size="10">High Priority</text>

  <rect x="55" y="235" width="190" height="80" rx="8" fill="rgba(255,255,255,0.08)"/>
  <text x="70" y="260" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">UI Dark Theme Specs</text>
  <rect x="70" y="275" width="55" height="18" rx="4" fill="#3b82f6"/>
  <text x="80" y="288" fill="#ffffff" font-family="sans-serif" font-size="10">Design</text>

  <!-- Column 2: IN PROGRESS -->
  <rect x="290" y="90" width="220" height="320" rx="12" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.3)"/>
  <text x="310" y="120" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">In Progress (2)</text>
  
  <rect x="305" y="140" width="190" height="90" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(56,189,248,0.5)"/>
  <text x="320" y="165" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Drag & Drop Card Engine</text>
  <text x="320" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">Assignee: @dev_sky</text>
  <rect x="320" y="195" width="70" height="18" rx="4" fill="#10b981"/>
  <text x="330" y="208" fill="#ffffff" font-family="sans-serif" font-size="10">80% Done</text>

  <!-- Column 3: DONE -->
  <rect x="540" y="90" width="220" height="320" rx="12" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.2)"/>
  <text x="560" y="120" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">Completed (4)</text>

  <rect x="555" y="140" width="190" height="80" rx="8" fill="rgba(255,255,255,0.08)"/>
  <text x="570" y="165" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">GitHub Pages CI/CD Setup</text>
  <rect x="570" y="180" width="50" height="18" rx="4" fill="#059669"/>
  <text x="580" y="193" fill="#ffffff" font-family="sans-serif" font-size="10">Merged</text>
