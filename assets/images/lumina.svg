<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="luminaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#luminaBg)"/>

  <!-- Glass Store Navigation -->
  <rect x="50" y="30" width="700" height="45" rx="12" fill="rgba(255,255,255,0.4)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <text x="80" y="58" fill="#0f172a" font-family="Outfit, sans-serif" font-size="18" font-weight="800">LUMINA GLASS</text>
  <text x="540" y="57" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="600">Store • Products • Cart (3)</text>

  <!-- Hero Product Banner -->
  <rect x="50" y="95" width="440" height="315" rx="18" fill="rgba(255,255,255,0.5)" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
  <text x="80" y="145" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">NEW GLASS COLLECTION 2026</text>
  <text x="80" y="185" fill="#0f172a" font-family="Outfit, sans-serif" font-size="28" font-weight="bold">Aether Cloud Headphones</text>
  <text x="80" y="215" fill="#475569" font-family="sans-serif" font-size="14">Immersive Spatial Audio with Glass Translucent Finish</text>
  <text x="80" y="270" fill="#0369a1" font-family="sans-serif" font-size="32" font-weight="bold">$299.00</text>
  
  <rect x="80" y="295" width="140" height="45" rx="22" fill="#0284c7"/>
  <text x="112" y="322" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Add to Cart</text>

  <!-- Product Grid Column right -->
  <rect x="510" y="95" width="240" height="150" rx="14" fill="rgba(255,255,255,0.4)" stroke="rgba(255,255,255,0.7)"/>
  <circle cx="630" cy="150" r="30" fill="rgba(2,132,199,0.3)"/>
  <text x="530" y="210" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Sky Glass Earbuds</text>
  <text x="530" y="230" fill="#0284c7" font-family="sans-serif" font-size="13" font-weight="bold">$129.00</text>

  <rect x="510" y="260" width="240" height="150" rx="14" fill="rgba(255,255,255,0.4)" stroke="rgba(255,255,255,0.7)"/>
  <circle cx="630" cy="315" r="30" fill="rgba(56,189,248,0.4)"/>
  <text x="530" y="375" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Cloud Charging Dock</text>
  <text x="530" y="395" fill="#0284c7" font-family="sans-serif" font-size="13" font-weight="bold">$79.00</text>
</svg>
