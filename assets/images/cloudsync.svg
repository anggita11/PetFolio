<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Grid Lines -->
  <path d="M 0 100 H 800 M 0 200 H 800 M 0 300 H 800 M 0 400 H 800" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <path d="M 150 0 V 450 M 300 0 V 450 M 450 0 V 450 M 600 0 V 450 M 750 0 V 450" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Top Glass Bar -->
  <rect x="30" y="30" width="740" height="40" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="60" cy="50" r="6" fill="#ef4444"/>
  <circle cx="80" cy="50" r="6" fill="#f59e0b"/>
  <circle cx="100" cy="50" r="6" fill="#10b981"/>
  <text x="130" y="55" fill="#94a3b8" font-family="Outfit, sans-serif" font-size="14" font-weight="600">CloudSync Enterprise Analytics Dashboard</text>

  <!-- Metric Cards -->
  <rect x="30" y="90" width="220" height="100" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(56,189,248,0.3)"/>
  <text x="50" y="120" fill="#94a3b8" font-family="sans-serif" font-size="13">Total Cloud Traffic</text>
  <text x="50" y="155" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="bold">2.4M requests</text>

  <rect x="270" y="90" width="230" height="100" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(0,245,212,0.3)"/>
  <text x="290" y="120" fill="#94a3b8" font-family="sans-serif" font-size="13">Server Uptime</text>
  <text x="290" y="155" fill="#00f5d4" font-family="sans-serif" font-size="28" font-weight="bold">99.98%</text>

  <rect x="520" y="90" width="250" height="100" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(168,85,247,0.3)"/>
  <text x="540" y="120" fill="#94a3b8" font-family="sans-serif" font-size="13">Active Microservices</text>
  <text x="540" y="155" fill="#c084fc" font-family="sans-serif" font-size="28" font-weight="bold">48 Nodes</text>

  <!-- Main Area Chart -->
  <rect x="30" y="210" width="740" height="210" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
  <path d="M 60 380 Q 150 330, 250 350 T 450 270 T 650 300 T 740 240 L 740 400 L 60 400 Z" fill="url(#chartGrad)"/>
  <path d="M 60 380 Q 150 330, 250 350 T 450 270 T 650 300 T 740 240" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <!-- Glowing Cloud Icon Badge -->
  <circle cx="700" cy="140" r="24" fill="url(#cloudGrad)"/>
  <path d="M 690 144 C 690 138 695 133 701 133 C 704 130 709 130 712 133 C 716 133 719 137 718 141 C 721 142 723 145 722 148 C 721 150 718 152 715 152 L 692 152 C 689 152 687 149 688 146 C 688 145 689 144 690 144 Z" fill="#ffffff"/>
</svg>
