<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nimbusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#nimbusBg)"/>
  
  <!-- Glass Card Mobile Container -->
  <rect x="250" y="30" width="300" height="390" rx="30" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <rect x="360" y="42" width="80" height="16" rx="8" fill="rgba(0,0,0,0.3)"/>

  <!-- Virtual Credit Card inside phone -->
  <rect x="280" y="80" width="240" height="135" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="300" y="110" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Nimbus Pay Black</text>
  <text x="300" y="160" fill="#ffffff" font-family="monospace" font-size="16" letter-spacing="2">•••• •••• •••• 8842</text>
  <text x="300" y="190" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="11">BALANCE: $14,850.00</text>
  <circle cx="490" cy="180" r="14" fill="rgba(255,255,255,0.3)"/>
  <circle cx="475" cy="180" r="14" fill="rgba(255,255,255,0.5)"/>

  <!-- Transaction List -->
  <rect x="275" y="230" width="250" height="45" rx="10" fill="rgba(255,255,255,0.08)"/>
  <circle cx="295" cy="252" r="12" fill="#10b981"/>
  <text x="315" y="248" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Transfer Received</text>
  <text x="315" y="264" fill="#94a3b8" font-family="sans-serif" font-size="10">From Alex Rivers</text>
  <text x="475" y="258" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">+$450.00</text>

  <rect x="275" y="285" width="250" height="45" rx="10" fill="rgba(255,255,255,0.08)"/>
  <circle cx="295" cy="307" r="12" fill="#38bdf8"/>
  <text x="315" y="303" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">QRIS Cloud Coffee</text>
  <text x="315" y="319" fill="#94a3b8" font-family="sans-serif" font-size="10">Payment Completed</text>
  <text x="485" y="313" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">-$12.50</text>

  <!-- Bottom Nav -->
  <rect x="275" y="350" width="250" height="50" rx="16" fill="rgba(15,23,42,0.6)"/>
  <circle cx="320" cy="375" r="10" fill="#38bdf8"/>
  <circle cx="400" cy="375" r="10" fill="rgba(255,255,255,0.3)"/>
  <circle cx="480" cy="375" r="10" fill="rgba(255,255,255,0.3)"/>
</svg>
